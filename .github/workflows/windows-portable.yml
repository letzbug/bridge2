# EMERGENCE LAB – portable Windows x64 distribution
#
# 1. source-tests  full pytest suite on Windows with real PySide6 and Playwright's Firefox,
#                  plus a real GUI smoke test on the runner's Windows desktop
# 2. build         PyInstaller one-folder build (core + audio variants), then tests of the FROZEN app
#                  with Python and Node.js removed from PATH:
#                    self-check · real PySide6 GUI smoke test of EmergenceLab.exe · optional browser runtime
#                    install + managed-Firefox pipeline test (core) · application folder unchanged
#                  and upload of the portable ZIP as an artifact
# 3. release       on tags v*: draft GitHub release with the ZIPs attached
#
# No step contacts an AI provider or uses an account. The browser tests use the local mock chat page.

name: Windows portable build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PLAYWRIGHT_BROWSERS_PATH: 'C:\playwright-browsers'

jobs:
  source-tests:
    name: Source tests (Windows, real PySide6)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright Firefox (test machine only)
        run: python -m playwright install firefox

      - name: Test suite (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -v --durations=15

      - name: GUI smoke test from source (native Windows desktop)
        env:
          EL_GUI_REPORT: ${{ runner.temp }}\gui-source.json
        run: python tests/gui_smoke.py real

      - name: Upload source test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-source-tests
          path: ${{ runner.temp }}/gui-source.json
          if-no-files-found: ignore

  build:
    name: Portable build (${{ matrix.variant }})
    needs: source-tests
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [core, audio]
    env:
      EL_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-audio.txt
            packaging/requirements-build.txt

      - name: Build portable folder (PyInstaller one-folder)
        shell: pwsh
        run: ./packaging/build_portable.ps1 -Variant ${{ matrix.variant }} -Python python -SkipZip

      - name: Locate build and snapshot the application folder
        id: dist
        shell: pwsh
        run: |
          $dir = Get-ChildItem "dist/${{ matrix.variant }}" -Directory | Select-Object -First 1
          if (-not $dir) { throw "no build folder found" }
          "path=$($dir.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($dir.Name)" >> $env:GITHUB_OUTPUT
          $reports = Join-Path $env:RUNNER_TEMP 'reports'
          New-Item -ItemType Directory -Force $reports | Out-Null
          "REPORTS=$reports" >> $env:GITHUB_ENV
          $root = $dir.FullName
          Get-ChildItem -LiteralPath $root -Recurse -File |
            ForEach-Object { "{0}|{1}" -f $_.FullName.Substring($root.Length), (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } |
            Sort-Object | Set-Content "$env:RUNNER_TEMP\snapshot-before.txt"
          $mb = [math]::Round(((Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
          Write-Host "Build: $root ($mb MB)"
          Get-Content (Join-Path $root 'BUILD-INFO.txt')

      - name: Frozen self-check (no Python or Node.js on PATH)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Get-ChildItem Env:PYTHON* -ErrorAction SilentlyContinue | Remove-Item
          & "${{ steps.dist.outputs.path }}\EmergenceLab-console.exe" --self-check --report "$env:REPORTS\self-check.json"
          $r = Get-Content "$env:REPORTS\self-check.json" -Raw | ConvertFrom-Json
          if (-not $r.passed) { throw "self-check failed" }
          if (-not $r.frozen) { throw "the executable did not run as a frozen build" }
          if (-not $r.data_outside_install_dir) { throw "data directory is inside the application folder" }
          if ($env:EL_VARIANT -eq 'audio' -and -not ($r.audio_available -and $r.stt_available)) {
            throw "the audio build does not contain working audio/transcription packages"
          }
          if ($env:EL_VARIANT -eq 'core' -and $r.audio_available) { Write-Warning "core build unexpectedly contains audio packages" }

      - name: Real PySide6 GUI smoke test of EmergenceLab.exe (native desktop, offscreen fallback)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Get-ChildItem Env:PYTHON* -ErrorAction SilentlyContinue | Remove-Item
          $exe = "${{ steps.dist.outputs.path }}\EmergenceLab.exe"
          function Run-GuiTest([string]$platform, [string]$report) {
            if ($platform -eq 'native') { Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue }
            else { $env:QT_QPA_PLATFORM = $platform }
            $p = Start-Process -FilePath $exe -ArgumentList @('--gui-selftest', '--report', "`"$report`"") -PassThru -Wait
            if (Test-Path $report) { Get-Content $report | Write-Host }   # Write-Host: keep the return value clean
            return [int]$p.ExitCode
          }
          $code = Run-GuiTest 'native' "$env:REPORTS\gui-selftest-native.json"
          if ($code -ne 0) {
            Write-Output "::warning::Native-desktop GUI smoke test failed (exit $code) - retrying with the Qt offscreen platform"
            $code = Run-GuiTest 'offscreen' "$env:REPORTS\gui-selftest-offscreen.json"
          }
          if ($code -ne 0) { throw "GUI smoke test of EmergenceLab.exe failed (exit $code)" }

      - name: Install the optional browser runtime through the portable app
        if: matrix.variant == 'core'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          & "${{ steps.dist.outputs.path }}\EmergenceLab-console.exe" --install-browser --report "$env:REPORTS\install-browser.json"

      - name: Managed Firefox pipeline test (bundled Playwright driver, local mock page)
        if: matrix.variant == 'core'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $exe = "${{ steps.dist.outputs.path }}\EmergenceLab-console.exe"
          & $exe --browser-selftest --report "$env:REPORTS\browser-selftest.json"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::Visible-window browser test failed - retrying headless"
            & $exe --browser-selftest --headless --report "$env:REPORTS\browser-selftest-headless.json"
            if ($LASTEXITCODE -ne 0) { throw "managed Firefox pipeline test failed" }
          }

      - name: Verify the application folder is unchanged and data lives outside it
        shell: pwsh
        run: |
          $root = "${{ steps.dist.outputs.path }}"
          Get-ChildItem -LiteralPath $root -Recurse -File |
            ForEach-Object { "{0}|{1}" -f $_.FullName.Substring($root.Length), (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } |
            Sort-Object | Set-Content "$env:RUNNER_TEMP\snapshot-after.txt"
          $diff = Compare-Object (Get-Content "$env:RUNNER_TEMP\snapshot-before.txt") (Get-Content "$env:RUNNER_TEMP\snapshot-after.txt")
          if ($diff) { $diff | Format-Table -AutoSize | Out-String | Write-Host; throw "the application folder was modified at runtime" }
          $data = Join-Path $env:LOCALAPPDATA 'EmergenceLab'
          if (-not (Test-Path (Join-Path $data 'logs\emergence-lab.log'))) { throw "expected the log file in $data" }
          if ($env:EL_VARIANT -eq 'core' -and -not (Get-ChildItem (Join-Path $data 'browser-runtime') -Directory -Filter 'firefox-*' -ErrorAction SilentlyContinue)) {
            throw "expected the optional browser runtime in $data\browser-runtime"
          }
          Write-Host "OK: application folder unchanged; data, logs and browser runtime in $data"

      - name: Create portable ZIP
        shell: pwsh
        run: ./packaging/build_portable.ps1 -Variant ${{ matrix.variant }} -ZipOnly

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist.outputs.name }}
          path: dist/${{ steps.dist.outputs.name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/reports
            ~/AppData/Local/EmergenceLab/logs
          if-no-files-found: ignore

  release:
    name: Draft release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: EmergenceLab-*-win-x64*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*.zip
